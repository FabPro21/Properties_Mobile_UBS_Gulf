allprojects {
    repositories {
        maven { url 'https://repo.maven.apache.org/maven2' }
        google()
        mavenCentral()
    }
    // dependencies {
    //     classpath 'com.android.tools.build:gradle:8.0.0'  // Make sure you're using a compatible version
    // }
//    dependencies {
//        classpath 'com.google.gms:google-services:4.3.5' // Use the latest version
//    }
}


rootProject.buildDir = "../build"
// // Add this part -------------->
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
subprojects {
    project.evaluationDependsOn(":app")
    
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
 ext.kotlin_version = '1.8.22' 

}




